<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Dicloxacillin Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-soft: #1e293b;
    --card: #1e293b;
    --accent: #38bdf8;
    --good: #22c55e;
    --good-soft: rgba(34,197,94,.16);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --line: #334155;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }

  body {
    display: flex; flex-direction: column;
    min-height: 100dvh;
    padding: calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
    max-width: 480px; margin: 0 auto;
  }

  header { text-align: center; margin-bottom: 12px; }
  header h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  /* Overall progress */
  .overall { margin: 12px 2px 4px; }
  .overall-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .overall-row .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .overall-row .val { font-size: 14px; font-weight: 700; }
  .overall-row .val b { color: var(--good); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--good));
    border-radius: 99px; transition: width .35s ease; }

  /* Day navigator */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 8px; }
  .nav button.arrow {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    width: 42px; height: 42px; border-radius: 12px; font-size: 20px; line-height: 1; cursor: pointer;
    flex: 0 0 auto; transition: background .15s, opacity .15s;
  }
  .nav button.arrow:active { background: var(--bg-soft); }
  .nav button.arrow:disabled { opacity: .3; cursor: default; }
  .nav .nav-center { text-align: center; flex: 1; }
  .nav .nav-day { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .nav .nav-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .nav .nav-date .badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px;
    background: var(--accent); color: #04263a; font-weight: 700; font-size: 10px; vertical-align: middle;
  }

  /* Carousel */
  .carousel { overflow: hidden; touch-action: pan-y; }
  .track { display: flex; will-change: transform; }
  .track.animate { transition: transform .3s cubic-bezier(.22,.61,.36,1); }
  .day { min-width: 100%; padding: 2px; }

  /* Dose grid */
  .doses { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dose {
    appearance: none; cursor: pointer; position: relative;
    border: 2px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 18px; padding: 18px 10px; min-height: 116px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    transition: transform .08s, background .2s, border-color .2s;
  }
  .dose:active { transform: scale(.96); }
  .dose .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: transparent; transition: background .2s, border-color .2s, color .2s;
  }
  .dose .name { font-size: 16px; font-weight: 700; }
  .dose .time { font-size: 12px; color: var(--muted); }

  .dose.taken { background: var(--good-soft); border-color: var(--good); }
  .dose.taken .ring { background: var(--good); border-color: var(--good); color: #04130a; }
  .dose.taken .time { color: var(--good); font-weight: 600; }

  .day-count { text-align: center; font-size: 13px; color: var(--muted); margin-top: 14px; min-height: 18px; }
  .day-count.full { color: var(--good); font-weight: 600; }

  /* Day dots */
  .dots { display: flex; justify-content: center; gap: 9px; margin: 18px 0 6px; flex-wrap: wrap; }
  .dotbtn { appearance: none; border: none; background: none; padding: 4px; cursor: pointer; }
  .dotbtn .pip {
    display: block; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--line); background: transparent; transition: all .2s;
  }
  .dotbtn .pip.partial { border-color: var(--accent); background: rgba(56,189,248,.35); }
  .dotbtn .pip.full { border-color: var(--good); background: var(--good); }
  .dotbtn.current .pip { transform: scale(1.45); box-shadow: 0 0 0 3px rgba(255,255,255,.12); }

  /* Today / settings */
  .row-actions { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .linkbtn {
    appearance: none; background: var(--card); border: 1px solid var(--line); color: var(--text);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 10px 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 7px; transition: background .15s, border-color .15s;
  }
  .linkbtn:active { background: var(--bg-soft); }
  .linkbtn.accent { color: #04263a; background: var(--accent); border-color: var(--accent); }
  /* Start-day button: make it obviously editable */
  #start-btn { border-color: var(--accent); }
  #start-btn .chg {
    background: var(--accent); color: #04263a; border-radius: 999px;
    padding: 2px 9px; font-size: 11px; font-weight: 700;
  }

  .start-panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
  .start-panel label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .start-panel input[type="date"] {
    appearance: none; flex: 1; min-width: 0; background: var(--bg-soft); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px; font-size: 16px; font-family: inherit; text-align: center;
  }
  .date-stepper { display: flex; align-items: stretch; gap: 8px; }
  .date-stepper .step {
    appearance: none; flex: 0 0 auto; width: 48px; border: 1px solid var(--line);
    background: var(--bg-soft); color: var(--text); border-radius: 10px;
    font-size: 22px; line-height: 1; cursor: pointer; transition: background .15s, opacity .15s;
  }
  .date-stepper .step:active { background: var(--line); }
  .date-stepper .step:disabled { opacity: .3; cursor: default; }
  .date-preview { text-align: center; font-size: 13px; color: var(--accent); font-weight: 600; min-height: 18px; }
  .start-panel .pa { display: flex; gap: 8px; }
  .start-panel .pa button { flex: 1; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .start-panel .pa #start-save { background: var(--accent); color: #04263a; }
  .start-panel .pa .ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }

  .spacer { flex: 1; }
  footer { text-align: center; font-size: 11px; color: var(--muted); opacity: .7; margin-top: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(22px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--good); color: #04130a; font-weight: 700; font-size: 14px;
    padding: 11px 20px; border-radius: 99px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.info { background: var(--accent); color: #04263a; }
</style>
</head>
<body>
  <header>
    <h1>Dicloxacillin Orion</h1>
    <p>4× daily · 9-day course</p>
  </header>

  <div class="overall">
    <div class="overall-row">
      <span class="lbl">Course progress</span>
      <span class="val"><b id="ov-count">0</b> / 36 doses</span>
    </div>
    <div class="bar"><i id="ov-bar"></i></div>
  </div>

  <div class="nav">
    <button class="arrow" id="prev" aria-label="Previous day">‹</button>
    <div class="nav-center">
      <div class="nav-day" id="nav-day">Day 1 of 9</div>
      <div class="nav-date" id="nav-date">—</div>
    </div>
    <button class="arrow" id="next" aria-label="Next day">›</button>
  </div>

  <div class="carousel" id="carousel">
    <div class="track" id="track"></div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="row-actions">
    <button class="linkbtn accent" id="today-btn" hidden>Jump to today</button>
    <button class="linkbtn" id="start-btn">Day 1 starts —</button>
    <button class="linkbtn" id="reset-btn">Reset</button>
  </div>

  <div class="start-panel" id="start-panel" hidden>
    <label for="start-date">What date did you take your first dose (Day 1)?</label>
    <div class="date-stepper">
      <button class="step" id="start-prev" aria-label="Previous day">‹</button>
      <input type="date" id="start-date" />
      <button class="step" id="start-next" aria-label="Next day">›</button>
    </div>
    <div class="date-preview" id="date-preview">—</div>
    <div class="pa">
      <button class="ghost" id="start-cancel">Cancel</button>
      <button id="start-save">Save</button>
    </div>
  </div>

  <div class="spacer"></div>
  <footer>Saved on this device only · no account needed</footer>

  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "dicloxacillin.course.v2";
  var OLD_KEY = "dicloxacillin.doses.v1";
  var DOSES_PER_DAY = 4;
  var COURSE_DAYS = 9;
  var TOTAL = DOSES_PER_DAY * COURSE_DAYS; // 36
  var SLOT_TIMES = [[8, 0], [13, 0], [18, 0], [22, 0]]; // suggested dose times

  // ---- date helpers ----
  function pad(n) { return String(n).padStart(2, "0"); }
  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function isoOf(ts) { var d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayISO() { return isoOf(Date.now()); }
  function parseISO(iso) { var p = iso.split("-"); return new Date(+p[0], (+p[1]) - 1, +p[2]); } // local midnight
  function dayDate(di) { var d = parseISO(state.start); d.setDate(d.getDate() + di); return d; }
  function todayIndex() {
    return Math.round((startOfDay(Date.now()) - parseISO(state.start).getTime()) / 86400000);
  }
  function slotTime(di, slot) {
    var d = dayDate(di); d.setHours(SLOT_TIMES[slot][0], SLOT_TIMES[slot][1], 0, 0); return d.getTime();
  }
  function fmtTs(ts) { return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function slotLabel(slot) { return fmtTs(slotTime(0, slot)); }
  function fmtDayDate(di) { return dayDate(di).toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }); }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  // ---- state ----
  function emptyGrid() {
    var g = [];
    for (var i = 0; i < COURSE_DAYS; i++) g.push([null, null, null, null]);
    return g;
  }

  function migrateFromV1() {
    var grid = emptyGrid();
    var start = todayISO();
    try {
      var raw = localStorage.getItem(OLD_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          arr = arr.filter(function (n) { return typeof n === "number"; }).sort(function (a, b) { return a - b; });
          if (arr.length) {
            start = isoOf(arr[0]);
            var startMs = startOfDay(arr[0]);
            arr.forEach(function (ts) {
              var di = Math.round((startOfDay(ts) - startMs) / 86400000);
              if (di >= 0 && di < COURSE_DAYS) {
                var slots = grid[di];
                for (var s = 0; s < DOSES_PER_DAY; s++) { if (slots[s] == null) { slots[s] = ts; break; } }
              }
            });
          }
        }
      }
    } catch (e) {}
    return { start: start, grid: grid };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s.start === "string" && Array.isArray(s.grid)) {
          // normalize shape
          var grid = emptyGrid();
          for (var d = 0; d < COURSE_DAYS; d++) {
            var src = s.grid[d] || [];
            for (var i = 0; i < DOSES_PER_DAY; i++) grid[d][i] = typeof src[i] === "number" ? src[i] : null;
          }
          return { start: s.start, grid: grid };
        }
      }
    } catch (e) {}
    var migrated = migrateFromV1();
    return migrated;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = loadState();
  var view = clamp(todayIndex(), 0, COURSE_DAYS - 1);

  // ---- elements ----
  var carousel = document.getElementById("carousel");
  var track = document.getElementById("track");
  var dotsWrap = document.getElementById("dots");
  var ovCount = document.getElementById("ov-count");
  var ovBar = document.getElementById("ov-bar");
  var navDay = document.getElementById("nav-day");
  var navDate = document.getElementById("nav-date");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var todayBtn = document.getElementById("today-btn");
  var startBtn = document.getElementById("start-btn");
  var resetBtn = document.getElementById("reset-btn");
  var startPanel = document.getElementById("start-panel");
  var startInput = document.getElementById("start-date");
  var startSave = document.getElementById("start-save");
  var startCancel = document.getElementById("start-cancel");
  var startPrev = document.getElementById("start-prev");
  var startNext = document.getElementById("start-next");
  var datePreview = document.getElementById("date-preview");
  var toastEl = document.getElementById("toast");

  // ---- build the day cards once ----
  function buildTrack() {
    track.innerHTML = "";
    for (var d = 0; d < COURSE_DAYS; d++) {
      var day = document.createElement("div");
      day.className = "day";

      var doses = document.createElement("div");
      doses.className = "doses";
      for (var s = 0; s < DOSES_PER_DAY; s++) {
        var b = document.createElement("button");
        b.className = "dose";
        b.dataset.day = d;
        b.dataset.slot = s;
        b.innerHTML =
          '<span class="ring">✓</span>' +
          '<span class="name">Dose ' + (s + 1) + '</span>' +
          '<span class="time"></span>';
        doses.appendChild(b);
      }
      day.appendChild(doses);

      var count = document.createElement("div");
      count.className = "day-count";
      day.appendChild(count);

      track.appendChild(day);
    }
  }

  // ---- render dynamic state ----
  function dayCount(d) {
    var c = 0, slots = state.grid[d];
    for (var i = 0; i < DOSES_PER_DAY; i++) if (slots[i] != null) c++;
    return c;
  }
  function totalCount() {
    var t = 0;
    for (var d = 0; d < COURSE_DAYS; d++) t += dayCount(d);
    return t;
  }

  function renderStates() {
    var ti = todayIndex();
    // dose buttons + per-day count
    var dayEls = track.children;
    for (var d = 0; d < COURSE_DAYS; d++) {
      var dayEl = dayEls[d];
      var btns = dayEl.querySelectorAll(".dose");
      for (var s = 0; s < DOSES_PER_DAY; s++) {
        var ts = state.grid[d][s];
        var btn = btns[s];
        var timeEl = btn.querySelector(".time");
        if (ts != null) {
          btn.classList.add("taken");
          timeEl.textContent = fmtTs(ts);
        } else {
          btn.classList.remove("taken");
          timeEl.textContent = slotLabel(s);
        }
      }
      var c = dayCount(d);
      var countEl = dayEl.querySelector(".day-count");
      if (c >= DOSES_PER_DAY) { countEl.textContent = "All 4 doses taken ✓"; countEl.classList.add("full"); }
      else { countEl.textContent = c + " of 4 doses taken"; countEl.classList.remove("full"); }
    }

    // overall
    var tot = totalCount();
    ovCount.textContent = String(tot);
    ovBar.style.width = (tot / TOTAL * 100) + "%";

    // navigator
    navDay.textContent = "Day " + (view + 1) + " of " + COURSE_DAYS;
    var badge = (view === ti) ? ' <span class="badge">Today</span>' : "";
    navDate.innerHTML = fmtDayDate(view) + badge;
    prevBtn.disabled = view <= 0;
    nextBtn.disabled = view >= COURSE_DAYS - 1;

    // jump-to-today visibility
    todayBtn.hidden = (view === ti) || ti < 0 || ti > COURSE_DAYS - 1;

    // dots
    dotsWrap.innerHTML = "";
    for (var i = 0; i < COURSE_DAYS; i++) {
      var c2 = dayCount(i);
      var btn2 = document.createElement("button");
      btn2.className = "dotbtn" + (i === view ? " current" : "");
      var pipCls = c2 >= DOSES_PER_DAY ? "full" : (c2 > 0 ? "partial" : "");
      btn2.innerHTML = '<span class="pip ' + pipCls + '"></span>';
      btn2.dataset.day = i;
      dotsWrap.appendChild(btn2);
    }

    // start label
    startBtn.innerHTML = "📅 Day 1 starts <b>" + dayDate(0).toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + "</b> <span class='chg'>Change</span>";
  }

  // ---- carousel positioning ----
  function setView(i, animate) {
    view = clamp(i, 0, COURSE_DAYS - 1);
    track.classList.toggle("animate", !!animate);
    track.style.transform = "translateX(" + (-view * 100) + "%)";
    renderStates();
  }

  // ---- toggle a dose ----
  function toggle(d, s) {
    var slots = state.grid[d];
    if (slots[s] != null) {
      slots[s] = null;
    } else {
      slots[s] = (d === todayIndex()) ? Date.now() : slotTime(d, s);
      if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
      var tot = totalCount();
      if (tot >= TOTAL) toast("Course complete! 🎉", true);
    }
    save();
    renderStates();
  }

  // ---- toast ----
  var toastTimer = null;
  function toast(msg, info) {
    toastEl.textContent = msg;
    toastEl.className = "toast show" + (info ? " info" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = "toast"; }, 1700);
  }

  // ---- tap a dose ----
  // Touch devices toggle in touchend (see below) and set this flag to swallow
  // the synthetic click; mouse/desktop falls through to this click handler.
  var suppressClick = false;
  track.addEventListener("click", function (e) {
    if (suppressClick) { suppressClick = false; return; }
    var btn = e.target.closest(".dose");
    if (!btn) return;
    toggle(+btn.dataset.day, +btn.dataset.slot);
  });

  dotsWrap.addEventListener("click", function (e) {
    var b = e.target.closest(".dotbtn");
    if (!b) return;
    setView(+b.dataset.day, true);
  });

  prevBtn.addEventListener("click", function () { setView(view - 1, true); });
  nextBtn.addEventListener("click", function () { setView(view + 1, true); });
  todayBtn.addEventListener("click", function () { setView(todayIndex(), true); });

  // ---- swipe + tap ----
  var startX = 0, startY = 0, dragging = false, width = 0, startTarget = null;
  carousel.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    startTarget = e.target;
    width = carousel.clientWidth; dragging = true;
    track.classList.remove("animate");
  }, { passive: true });

  carousel.addEventListener("touchmove", function (e) {
    if (!dragging) return;
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) < Math.abs(dy)) { return; } // let vertical scroll win
    // resist at edges
    if ((view === 0 && dx > 0) || (view === COURSE_DAYS - 1 && dx < 0)) dx *= 0.3;
    track.style.transform = "translateX(" + (-view * width + dx) + "px)";
  }, { passive: true });

  carousel.addEventListener("touchend", function (e) {
    if (!dragging) return;
    dragging = false;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    var threshold = Math.min(60, width * 0.18);

    // Small movement in both axes = a tap: toggle the dose under the finger.
    if (Math.abs(dx) < 14 && Math.abs(dy) < 14) {
      setView(view, true); // snap back if a tiny drag nudged the track
      var btn = startTarget && startTarget.closest ? startTarget.closest(".dose") : null;
      if (btn && carousel.contains(btn)) {
        suppressClick = true; setTimeout(function () { suppressClick = false; }, 500);
        toggle(+btn.dataset.day, +btn.dataset.slot);
      }
      return;
    }

    // Otherwise treat as a horizontal swipe.
    suppressClick = true; setTimeout(function () { suppressClick = false; }, 500);
    if (dx <= -threshold && view < COURSE_DAYS - 1) setView(view + 1, true);
    else if (dx >= threshold && view > 0) setView(view - 1, true);
    else setView(view, true);
  });

  // ---- start-date editing ----
  function syncDatePanel() {
    var iso = startInput.value || todayISO();
    // never let the first dose be in the future
    if (iso > todayISO()) { iso = todayISO(); startInput.value = iso; }
    startInput.max = todayISO();
    var d = parseISO(iso);
    datePreview.textContent = d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    startNext.disabled = iso >= todayISO();
  }
  function stepStart(delta) {
    var d = parseISO(startInput.value || todayISO());
    d.setDate(d.getDate() + delta);
    if (d.getTime() > parseISO(todayISO()).getTime()) return; // don't go past today
    startInput.value = isoOf(d.getTime());
    syncDatePanel();
  }
  startBtn.addEventListener("click", function () {
    if (startPanel.hidden) { startInput.value = state.start; syncDatePanel(); startPanel.hidden = false; }
    else startPanel.hidden = true;
  });
  startPrev.addEventListener("click", function () { stepStart(-1); });
  startNext.addEventListener("click", function () { stepStart(1); });
  startInput.addEventListener("change", syncDatePanel);
  startCancel.addEventListener("click", function () { startPanel.hidden = true; });
  startSave.addEventListener("click", function () {
    if (!startInput.value) { toast("Pick a date"); return; }
    state.start = startInput.value;
    save();
    startPanel.hidden = true;
    setView(clamp(todayIndex(), 0, COURSE_DAYS - 1), false);
    toast("Start date updated", true);
  });

  resetBtn.addEventListener("click", function () {
    if (!confirm("Reset the whole course? This clears every logged dose on this device.")) return;
    state = { start: todayISO(), grid: emptyGrid() };
    save();
    setView(0, false);
    toast("Course reset");
  });

  // recalc transform on resize/orientation
  window.addEventListener("resize", function () { setView(view, false); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { state = loadState(); buildTrack(); setView(clamp(view, 0, COURSE_DAYS - 1), false); }
  });

  // ---- init ----
  buildTrack();
  setView(view, false);
})();
</script>
</body>
</html>
